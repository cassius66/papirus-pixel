name: Papirus-Pixel release

# Rebuilds Papirus-Pixel whenever the icons it is drawn from, or the script
# that draws them, change on master, and attaches it to a release that
# pixel/install.sh downloads.

on:
  push:
    branches:
      - master
    paths:
      - 'Papirus/**'
      - 'Papirus-Dark/**'
      - 'pixel/papirus-pixel.py'
      - 'pixel/aliases.txt'
      - '.github/workflows/papirus-pixel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papirus-pixel-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      short: ${{ steps.name.outputs.short }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the SVG renderer
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y librsvg2-bin

    - name: Build
      run: python3 pixel/papirus-pixel.py

    # Largest sizes first. Launchers that keep the first icon file they find,
    # such as Omarchy's, then show the 24 px outlined drawing, not the 16 px one.
    - name: Package
      run: |
        sizes=$(ls Papirus-Pixel | grep -E '^[0-9]+x' | sort -t x -k1,1nr)
        tar -czf Papirus-Pixel.tar.gz Papirus-Pixel/index.theme $(printf 'Papirus-Pixel/%s ' $sizes)

    - name: Name the release
      id: name
      run: |
        echo "tag=pixel-$(git show -s --format=%cd --date=format:%Y%m%d HEAD)" >> "$GITHUB_OUTPUT"
        echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: papirus-pixel
        path: Papirus-Pixel.tar.gz
        retention-days: 1

  # Only this job can write, and it runs no code from the repository.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: papirus-pixel

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.build.outputs.tag }}
        SHORT: ${{ needs.build.outputs.short }}
        REPO: ${{ github.repository }}
      run: |
        if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
          gh release upload "$TAG" Papirus-Pixel.tar.gz --clobber -R "$REPO"
        else
          gh release create "$TAG" Papirus-Pixel.tar.gz -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Papirus-Pixel $TAG" \
            --notes "Built from $SHORT by pixel/papirus-pixel.py."
        fi
